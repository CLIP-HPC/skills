# Managed by CLIP-HPC deploy/install-host.sh; merge by hand if /etc/codex has other settings.
check_for_update_on_startup = false

[features]
plugins = true

# A git source makes Codex install and update cbe for each user at startup.
[marketplaces.clip-hpc]
source_type = "git"
source = "@SKILLS_CLONE@"

[plugins."cbe@clip-hpc"]
enabled = true
